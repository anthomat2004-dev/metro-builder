<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Opening Metro Builder...</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(520px, calc(100% - 40px));
      padding: 32px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 8px 0;
      color: #bbb;
    }

    button {
      margin-top: 20px;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Opening Metro Builder...</h1>
    <p id="status">Launching Roblox.</p>
    <button id="openButton" hidden>Open Roblox</button>
  </main>

  <script>
    (() => {
      const PLACE_ID = "140473283529865";

      let basePath = "";

      if (window.location.hostname.endsWith("github.io")) {
        basePath = "/metro-builder";
      }

      const path = window.location.pathname;

      const relativePath =
        basePath && path.startsWith(basePath)
          ? path.slice(basePath.length)
          : path;

      const parts = relativePath
        .split("/")
        .filter(Boolean);

      if (
        parts.length === 2 &&
        parts[0].toLowerCase() === "play"
      ) {
        const mapId = parts[1];

        if (!/^[A-Za-z0-9_-]{1,100}$/.test(mapId)) {
          window.location.replace(basePath + "/404/");
          return;
        }

        const robloxUrl =
          "roblox://placeId=" +
          encodeURIComponent(PLACE_ID) +
          "&launchData=" +
          encodeURIComponent(mapId);

        const button = document.getElementById("openButton");
        const status = document.getElementById("status");
        const title = document.getElementById("title");

        button.hidden = false;

        const tryClose = () => {
          try {
            window.open("", "_self");
            window.close();
          } catch (e) {}

          setTimeout(() => {
            title.textContent = "Metro Builder opened";
            status.textContent = "You can close this tab.";
          }, 300);
        };

        button.addEventListener("click", () => {
          window.location.href = robloxUrl;

          setTimeout(() => {
            tryClose();
          }, 1400);
        });

        // Automatic launch attempt.
        window.location.href = robloxUrl;

        // Attempt to close shortly after Roblox is launched.
        setTimeout(() => {
          tryClose();
        }, 1400);

        // If the custom protocol was blocked, keep a manual fallback button.
        setTimeout(() => {
          if (!document.hidden) {
            status.textContent =
              "If Roblox did not open automatically, click the button below.";
          }
        }, 2200);

        return;
      }

      window.location.replace(basePath + "/404/");
    })();
  </script>
</body>
</html>
